name: Daily Outreach Run
on:
  schedule:
    - cron: '0 13 * * *'  # 13:00 UTC daily
  workflow_dispatch: {}     # lets you trigger it manually from GitHub's Actions tab too

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call pipeline endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          for i in $(seq 1 40); do
            echo "--- pipeline iteration $i ---"
            RESPONSE=$(curl -fsS -X GET "$APP_URL/api/run-pipeline" || true)
            if [ -z "$RESPONSE" ]; then
              echo "No response, retrying..."
              sleep 15
              continue
            fi
            echo "$RESPONSE"
            if ! echo "$RESPONSE" | grep -q '"hasRemaining":true'; then
              echo "Pipeline finished."
              exit 0
            fi
            echo "More work remaining, waiting 15s before next iteration..."
            sleep 15
          done
          echo "Pipeline reached max iterations; run again to continue remaining work."
          exit 0
